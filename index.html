<style>
/* Layout: sidebar + conteúdo no PC; barra de abas embaixo no celular; barra de lançamento rápido fixa em todas as telas */
:root {
  --bg: #0E0D14; --surface: #18161F; --surface2: #221F2C; --ink: #F4F2FA; --ink2: #A49FB8; --line: #2B2837;
  --accent: #8B5CF6; --accent-ink: #FFFFFF; --accent-soft: #2B2050; --amber: #FBBF24;
  --good: #34D399; --good-soft: #12342B; --warn: #FBBF24; --warn-soft: #3A2F14; --bad: #FB7185; --bad-soft: #3F1D26;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --side: 232px; --tabbar: 66px; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F3FA; --surface: #FFFFFF; --surface2: #EFEBF8; --ink: #1B1530; --ink2: #6B6580; --line: #E3DEF0;
    --accent: #6D28D9; --accent-ink: #FFFFFF; --accent-soft: #EBE3FB; --amber: #D97706;
    --good: #0F9D6B; --good-soft: #D9F4E8; --warn: #9A6A07; --warn-soft: #FBEFCB; --bad: #D6314F; --bad-soft: #FCE0E5;
    --shadow: 0 1px 2px rgba(27,21,48,.06), 0 10px 30px rgba(27,21,48,.08); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F3FA; --surface: #FFFFFF; --surface2: #EFEBF8; --ink: #1B1530; --ink2: #6B6580; --line: #E3DEF0;
  --accent: #6D28D9; --accent-ink: #FFFFFF; --accent-soft: #EBE3FB; --amber: #D97706;
  --good: #0F9D6B; --good-soft: #D9F4E8; --warn: #9A6A07; --warn-soft: #FBEFCB; --bad: #D6314F; --bad-soft: #FCE0E5;
  --shadow: 0 1px 2px rgba(27,21,48,.06), 0 10px 30px rgba(27,21,48,.08); color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }

.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 20px; max-width: 1180px; margin: 0 auto; }
.side {
  position: sticky; top: 16px; align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 17px var(--font-display); }
.brand b { font: 700 17px var(--font-display); display: block; line-height: 1.1; }
.brand span { font-size: 12px; color: var(--ink2); }
.navbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 12px;
  padding: 10px 12px; color: var(--ink2); font-weight: 500;
}
.navbtn svg { width: 20px; height: 20px; flex: none; }
.navbtn:hover { background: var(--surface2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: 14px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink2); }

.main { min-width: 0; padding-bottom: 150px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 26px; }
.monthnav { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.monthnav button { background: none; border: 0; border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink2); }
.monthnav button:hover { background: var(--surface2); color: var(--ink); }
.monthnav .lbl { min-width: 140px; text-align: center; font-weight: 600; }
.monthnav svg { width: 18px; height: 18px; }

.grid { display: grid; gap: 14px; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.shopstats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#moneycards { gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat .k { font-size: 12px; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat .v { font: 700 25px/1.15 var(--font-display); margin: 6px 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .s { font-size: 12.5px; color: var(--ink2); }
.stat.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stat.hero .k, .stat.hero .s { color: inherit; opacity: .85; }

.bar { height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.over > i { background: var(--bad); }
.cats { display: grid; gap: 10px; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; }
.catrow .bar { grid-column: 1 / -1; height: 7px; }
.catrow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list { display: grid; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--line); padding: 11px 2px; border-radius: 0;
}
.list > .row:first-child { border-top: 0; }
button.row:hover { background: var(--surface2); }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .m { font-size: 12.5px; color: var(--ink2); }
.row .a { font: 600 15px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--ink2); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface2); color: var(--ink2); }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; font-weight: 600; text-transform: capitalize; }
.dayhead .num { color: var(--ink2); font-weight: 500; }

.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; font-weight: 600; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn svg { width: 18px; height: 18px; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.billgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bill { display: flex; flex-direction: column; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; min-width: 0; }
.bill .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bill .h b { font: 600 14px var(--font-display); color: var(--ink2); }
.bill .amt { font: 700 24px var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bill .d { font-size: 13px; color: var(--ink2); }
.bill .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.bill.paid .amt { color: var(--ink2); text-decoration: line-through; text-decoration-thickness: 1px; }
.bill.empty { border-style: dashed; background: transparent; color: var(--ink2); align-items: flex-start; justify-content: center; min-height: 118px; }
.bill.empty:hover { background: var(--surface2); }
.bill.empty b { color: var(--ink); font: 600 15px var(--font-display); }

.shopitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 11px 2px; border-top: 1px solid var(--line); }
.shopitem:first-child { border-top: 0; }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--accent-ink); }
.check svg { width: 16px; height: 16px; opacity: 0; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { opacity: 1; }
.shopitem.done .nm { color: var(--ink2); text-decoration: line-through; }
.shopitem .nm { font-weight: 500; overflow-wrap: anywhere; }
.shopitem .sub { font-size: 12.5px; color: var(--ink2); grid-column: 2; }
.shopitem .pr { font: 600 15px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; grid-row: 1; grid-column: 3; }
.shopitem .editb { grid-row: 2; grid-column: 3; justify-self: end; background: none; border: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 0; }
.cartbar { position: sticky; bottom: calc(var(--composer-h, 120px) + 10px); margin-top: 14px; background: var(--surface); color: var(--ink); border: 2px solid var(--accent); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }
.cartbar b { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.cartbar small { display: block; color: var(--ink2); }
.cartbar .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; }
.in, select.in {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; min-width: 0;
}
.in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.inline { display: flex; gap: 8px; }
.inline .in { flex: 1; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; }
.banner p { margin: 0; max-width: 62ch; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.good { background: var(--good-soft); color: var(--good); }
.alert.info { background: var(--surface2); color: var(--ink); }
.alerts { display: grid; gap: 8px; }

.ecoout { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.bubbles { display: grid; gap: 10px; margin: 12px 0; }
.bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.u { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.bubble.a { justify-self: start; background: var(--surface2); border-bottom-left-radius: 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chipbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; }
.chipbtn:hover { background: var(--surface2); }
.muted { color: var(--ink2); }
.small { font-size: 12.5px; }
.sp { height: 14px; }

/* Lançamento rápido */
.composer {
  position: fixed; z-index: 20; bottom: 0; left: 0; right: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  pointer-events: none;
}
.composer-in { max-width: 1180px; margin: 0 auto; padding-left: calc(var(--side) + 20px); pointer-events: none; }
.cbox { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px; }
.cbox input { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; padding: 10px 0; outline: none; }
.cbox:focus-within { border-color: var(--accent); }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 0; display: grid; place-items: center; flex: none; background: var(--surface2); color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.go { background: var(--accent); color: var(--accent-ink); }
.iconbtn.rec { background: var(--bad); color: #fff; animation: pulse 1.3s ease-in-out infinite; }
.cstatus { pointer-events: auto; font-size: 13px; color: var(--ink); margin: 0 0 8px; padding: 7px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; width: fit-content; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
.cstatus:empty { display: none; }
.cstatus .undo { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; text-decoration: underline; }
.hints { font-size: 12.5px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(182,58,43,.45); } 50% { box-shadow: 0 0 0 8px rgba(182,58,43,0); } }

.tabbar {
  display: none; position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar .inner { display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { background: none; border: 0; padding: 7px 2px 6px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink2); border-radius: 10px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.modalwrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(8,16,13,.55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 20px; width: min(460px, 100%); padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.modal h2 { font-size: 20px; }
.modal .two { gap: 12px; }
.modal .foot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.check-inline { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.check-inline input { width: 20px; height: 20px; accent-color: var(--accent); }
.skeleton { color: var(--ink2); padding: 40px 0; text-align: center; }
.empty { text-align: center; color: var(--ink2); padding: 22px 8px; }

@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .billgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  :root { --side: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .tabbar { display: block; }
  .composer { bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); padding-bottom: 8px; }
  .composer-in { padding-left: 0; }
  .main { padding-bottom: 190px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .top h1 { font-size: 22px; }
  .cartbar { bottom: calc(var(--tabbar) + var(--composer-h, 120px) + 14px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 820px) { #moneycards { grid-template-columns: minmax(0, 1fr) !important; } }
@media (max-width: 520px) {
  .shopstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shopstats > :nth-child(3) { grid-column: 1 / -1; }
  .billgrid { grid-template-columns: minmax(0, 1fr); }
  .stat .v { font-size: 21px; }
  .monthnav .lbl { min-width: 116px; }
}

/* ===== Visual v2: escuro, roxo, cartões grandes ===== */
body { padding-top: max(10px, env(safe-area-inset-top, 0px)); }
.card { border-radius: 22px; padding: 18px; }
.card h2 { font-size: 17px; }
.btn { border-radius: 14px; }
.btn.primary { box-shadow: 0 6px 18px rgba(139,92,246,.28); }
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; margin-bottom: 16px; }
.top h1 { font-size: 26px; }
.avatar { display: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--ink); font: 700 18px var(--font-display); place-items: center; }
.roundbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent-soft); font-size: 21px; display: grid; place-items: center; }
.monthnav { background: transparent; border: 0; }
.monthnav .lbl { font: 600 17px var(--font-display); }
.hero2 { position: relative; overflow: hidden; border-radius: 28px; padding: 20px 20px 18px; margin-bottom: 16px; color: #fff;
  background: radial-gradient(520px 260px at 85% -10%, rgba(139,92,246,.55), transparent 70%), linear-gradient(160deg, #2A1B5E 0%, #1A1438 60%, #14111F 100%);
  border: 1px solid rgba(139,92,246,.25); box-shadow: var(--shadow); }
:root[data-theme="light"] .hero2 { border-color: transparent; }
.hero2 .hl { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; opacity: .8; }

      price = parseBRL(p[1]) || 0;
      s = s.slice(0, p.index);

      if (!allLoaded()) $("#view").innerHTML = '<div class="skeleton">Ainda n\xE3o consegui carregar seus dados. Se o problema continuar, recarregue a p\xE1gina.</div>';
    }, 12e3);
    const mark = (k) => {
      S.loaded[k] = true;
      if (allLoaded()) clearTimeout(fail);
    };
    Store.sub("lanc", (a) => {
      S.lanc = a;
      mark("lanc");
      render();
    }, () => {
    });
    Store.sub("contas", (a) => {
      S.contas = a;
      mark("contas");
      render();
    }, () => {
    });
    Store.sub("compras", (a) => {
      S.compras = a;
      mark("compras");
      render();
    }, () => {
    });
    Store.sub("cfg", (a) => {
      const c = a.find((x) => x.id === "main");
      const m0 = todayStr().slice(0, 7);
      S.cfg = c ? { budget: c.budget || 0, shopLimit: c.shopLimit || 0, income: null, balance: null, incomeBy: c.incomeBy || (c.income != null ? { [m0]: c.income } : {}), balanceBy: c.balanceBy || (c.balance != null ? { [m0]: c.balance } : {}) } : { budget: 0, shopLimit: 0, income: null, balance: null, incomeBy: {}, balanceBy: {} };
      mark("cfg");
      render();
    }, () => {
    });
    let pend = null;
    try {
      pend = localStorage.getItem("eco:pendingUser");
    } catch (e) {
    }
    const loadProf = () => SB.from("profiles").select("name,phone,username").eq("user_id", session.user.id).maybeSingle().then(({ data }) => {
      if (data) S.profile = { name: data.name || "", phone: data.phone || "", username: data.username || "" };
    });
    if (pend) SB.from("profiles").upsert({ user_id: session.user.id, username: pend }, { onConflict: "user_id" }).then(() => {
      try {
        localStorage.removeItem("eco:pendingUser");
      } catch (e) {
      }
      loadProf();
    });
    else loadProf();
  }
  async function boot() {
    $("#send").innerHTML = IC.send;
    wireAuth();
    showAuth("login");
    render();
    setupDictation();
    if (window.ResizeObserver) new ResizeObserver(() => {
      const ch = $("#composer").offsetHeight;
      if (ch) document.documentElement.style.setProperty("--composer-h", ch + "px");
    }).observe($("#composer"));
    SB.auth.onAuthStateChange((ev, session) => {
      if (ev === "PASSWORD_RECOVERY") {
        document.body.classList.remove("authed");
        showAuth("reset");
        return;
      }
      if (session) {
        if (A.mode === "reset") return;
        setTimeout(() => startApp(session), 0);
      } else {
        document.body.classList.remove("authed");
        A.started = false;
        Store.uid = null;
        S.lanc = [];
        S.contas = [];
        S.compras = [];
        showAuth("login");
      }
    });
  }
  boot();
})();
</script>
</body>
</html>
